name: Publish GNOME Extension

on:
  push:
    tags:
      - '*'  # Fires on real `git push --tags` from the CLI
  release:
    types: [published]  # Fires when a release is published via the GitHub UI,
                         # since GitHub-UI-created tags don't reliably trigger push events
  workflow_dispatch: {}  # temporary: manual trigger to diagnose why Actions never runs

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install gnome-extension-publisher
        run: |
          python -m pip install --upgrade pip
          pip install gnome-extension-publisher

      - name: build
        run: |
          gep build

      - name: Publish GNOME Extension
        env:
          GEP_USERNAME: ${{ secrets.GEP_USERNAME }}
          GEP_PASSWORD: ${{ secrets.GEP_PASSWORD }}
        # `gep publish` posts to the legacy /upload/ form endpoint, which
        # extensions.gnome.org retired in favor of a JSON API at
        # /api/v1/extensions - see .github/scripts/publish_extension.py
        run: python .github/scripts/publish_extension.py dist/streamcontroller@core447.com_v*.zip
